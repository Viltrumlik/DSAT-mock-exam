name: ms_webview2
description: >-
  MasterSAT's patched copy of webview_flutter_windows 1.3.0 (BSD-3): WebView2
  drawn into a Flutter texture, locked down for the exam islands. See NOTICE.
version: 1.3.0+ms.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MsWebview2Plugin
