name: MasterSAT
options:
  bundleIdPrefix: uz.mastersat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MasterSATKit:
    path: ../MasterSATKit

targets:
  MasterSAT:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # The app icon and the brand mark, both generated from the site's own
      # frontend/public/images/logo.png — see ios/README.md.
      - path: Resources/Assets.xcassets
      # KaTeX, vendored. `type: folder` keeps the directory structure intact in the
      # bundle — katex.min.css asks for `fonts/KaTeX_Main-Regular.woff2` by relative
      # path, and a flattened resource copy would break every glyph.
      - path: Resources/katex
        type: folder
      # The privacy manifest App Store Connect checks on upload. Named explicitly as a
      # resource: XcodeGen does not know the .xcprivacy type and would otherwise guess.
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/MasterSAT.entitlements
        buildPhase: none
    dependencies:
      - package: MasterSATKit
    # No `info:` key on purpose. That key tells XcodeGen to GENERATE a plist at the given
    # path, overwriting the hand-written one on every `xcodegen generate`. Pointing
    # INFOPLIST_FILE at the checked-in file instead keeps it authoritative.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.mastersat.app
        # What the backend's release policy compares against (X-MasterSAT-Client). Raise
        # MARKETING_VERSION for a release; raise CURRENT_PROJECT_VERSION for EVERY upload —
        # App Store Connect refuses a build number it has already seen for that version.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        # Push notifications — OFF until the learning center has a paid Apple Developer
        # account. A free "Personal Team" cannot sign the aps-environment entitlement at all,
        # so with it on the build fails to sign. Turn on with MASTERSAT_PUSH: YES here, or
        # `xcodebuild … MASTERSAT_PUSH=YES`; the server half stays inert until APNS_* is set
        # (backend/notifications/apns.py). Info.plist carries the switch to the app, which
        # asks for a device token only when it is on.
        MASTERSAT_PUSH: "NO"
        MASTERSAT_ENTITLEMENTS_YES: Resources/MasterSAT.entitlements
        MASTERSAT_ENTITLEMENTS_NO: ""
        CODE_SIGN_ENTITLEMENTS: $(MASTERSAT_ENTITLEMENTS_$(MASTERSAT_PUSH))
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Without this the home screen shows the blank default tile no matter what the
        # catalogue contains — the icon is chosen by build setting, and GENERATE_INFOPLIST_FILE
        # is off, so nothing else fills it in.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
