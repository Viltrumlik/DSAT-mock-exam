name: MasterSAT
options:
  bundleIdPrefix: uz.mastersat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MasterSATKit:
    path: ../MasterSATKit

targets:
  MasterSAT:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # KaTeX, vendored. `type: folder` keeps the directory structure intact in the
      # bundle — katex.min.css asks for `fonts/KaTeX_Main-Regular.woff2` by relative
      # path, and a flattened resource copy would break every glyph.
      - path: Resources/katex
        type: folder
    dependencies:
      - package: MasterSATKit
    # No `info:` key on purpose. That key tells XcodeGen to GENERATE a plist at the given
    # path, overwriting the hand-written one on every `xcodegen generate`. Pointing
    # INFOPLIST_FILE at the checked-in file instead keeps it authoritative.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.mastersat.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
