name: MasterSAT
options:
  bundleIdPrefix: uz.mastersat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MasterSATKit:
    path: ../MasterSATKit

targets:
  MasterSAT:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: MasterSATKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.mastersat.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # The runner is a single-purpose, focused surface. Landscape on iPad is allowed
        # because a passage and an answer pane side by side is the point of the layout.
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: MasterSAT
