# ============================================================
# nginx.conf — Nginx Site Configuration
# Place at: /etc/nginx/sites-available/satapp
# Enable: ln -s /etc/nginx/sites-available/satapp /etc/nginx/sites-enabled/
# ============================================================
# SSL block will be filled in automatically by certbot.
#
# Subdomains used by consoles:
# - admin.mastersat.uz      (bulk assign + users)
# - questions.mastersat.uz  (tests/questions authoring)
# - teacher.mastersat.uz    (teacher portal: teacher + super_admin)

server {
    listen 80;
    server_name mastersat.uz www.mastersat.uz admin.mastersat.uz questions.mastersat.uz teacher.mastersat.uz;

    # Allow ACME HTTP-01 challenges for Let's Encrypt renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mastersat.uz www.mastersat.uz admin.mastersat.uz questions.mastersat.uz teacher.mastersat.uz;

    # ── SSL (Certbot will fill these in) ─────────────────────
    # ssl_certificate /etc/letsencrypt/live/mastersat.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mastersat.uz/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ── Gzip Compression ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── Maintenance page (deploys stop PM2 before migrating) ───
    # Lives under shared/, never under current/: the release symlink is being
    # swapped exactly when this page is needed, and a release dir may not exist
    # yet. Served as 503 + Retry-After, not 200, so crawlers hold the ranking
    # and browsers know to come back.
    location = /__maintenance.html {
        internal;
        root /var/www/satapp/shared/maintenance;
        try_files /index.html =503;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
    }

    # The API answers JSON to a JSON client. Handing the HTML page to axios
    # would surface as an unparseable body rather than a clean "we're down".
    location = /__maintenance.json {
        internal;
        root /var/www/satapp/shared/maintenance;
        default_type application/json;
        try_files /api.json =503;
        add_header Retry-After 60 always;
        add_header Cache-Control "no-store" always;
    }

    # ── Django Static Files (per release under current/) ───────
    location /static/ {
        alias /var/www/satapp/current/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Django Media Files (shared across releases) ───────────
    location /media/ {
        alias /var/www/satapp/shared/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Django REST API ───────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 60M;

        # Gunicorn is down mid-deploy — answer JSON, and 503 rather than 502 so
        # the client can tell "temporarily down" from "broken upstream".
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__maintenance.json;
    }

    # ── Prometheus scrape endpoints (protect at Nginx) ─────────
    # Recommended: configure htpasswd at /etc/nginx/.htpasswd-metrics
    location ~ ^/api/(exams|realtime|assessments)/.+/metrics/prometheus/?$ {
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/.htpasswd-metrics;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django Admin ──────────────────────────────────────────
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Next.js Frontend ──────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Next is down mid-deploy — show the builder instead of nginx's 502.
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /__maintenance.html;

        # Cache Next.js static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:3000;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;

            # The browser asked for JavaScript, not a 10 KB HTML page. Note that
            # `proxy_intercept_errors off` would NOT do this: it only suppresses
            # errors the upstream itself returned, while a dead upstream is nginx
            # generating the 502, which error_page still catches.
            error_page 502 503 504 = @asset_unavailable;
        }
    }

    # Bare, bodyless 503 for assets while the app is down — fails fast and cheap.
    location @asset_unavailable {
        return 503;
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/satapp-access.log;
    error_log /var/log/nginx/satapp-error.log warn;
}
