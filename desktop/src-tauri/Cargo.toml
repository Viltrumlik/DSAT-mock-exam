[package]
name = "mastersat-desktop"
version = "0.1.0"
description = "MasterSAT exam app for Windows"
authors = ["MasterSAT"]
edition = "2021"
rust-version = "1.77"

# The proof and the lockdown live in their own member crates so they build and test without Tauri
# or the Linux GUI stack (`cargo test -p mastersat-proof`), and so the native rewrite
# (desktop-native/native) can share them by path. The root package is a member implicitly.
[workspace]
members = ["crates/proof", "crates/lockdown"]

# A plain binary crate. This shell is Windows-only (midterms are sat on school laptops), so there
# is no mobile entry point and no library split — `main.rs` is the whole program.

[build-dependencies]
# AppManifest::commands (build.rs) lands the per-command ACL permissions this app relies on to
# keep the native lockdown callable from mastersat.uz alone. Needs tauri-build 2.x.
# Default features (incl. config-json, which reads tauri.conf.json) stay on.
tauri-build = "2"

[dependencies]
# >= 2.11.1 is a hard floor, not a preference: before it a remote origin could invoke custom
# commands with no capability at all, and is_local_url() misclassified remote URLs as trusted
# local origins on Windows (CVE-2026-42184). This app's entire premise — "another site opened
# in the window cannot drive the lockdown" — depends on the fixed ACL. Do not relax this.
# Default features (incl. the `wry` webview runtime) stay on.
tauri = "2.11.1"
tauri-plugin-deep-link = "2"
# The deep-link feature forwards a second launch's mastersat:// URL into the already-running
# window instead of starting a second copy.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# The app's bundled UI reaches the API through this (a native HTTP request, so the app's local
# origin is not subject to browser CORS). Scoped to https://mastersat.uz/* in capabilities/.
# Every default feature EXCEPT `cookies`: the app authenticates with `Authorization: Bearer` alone,
# and a cookie jar is actively harmful — the server treats any request carrying an lms_* auth
# cookie as a browser's (users.auth_cookies.is_native_client), and every POST would then fail its
# CSRF origin check. 2.8 is the line whose defaults are exactly this list plus cookies.
tauri-plugin-http = { version = "2.8", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The lockdown proof — byte-for-byte the same arithmetic as backend/desktop/proof.py, in its own
# Tauri-free crate so the shared vectors test fast on any host.
mastersat-proof = { path = "crates/proof" }
# The machine lockdown (pre-check, keyboard guard, capture exclusion, battery) — the former
# src/lockdown.rs, moved verbatim into its own crate; main.rs uses it as `lockdown::`.
mastersat-lockdown = { path = "crates/lockdown" }
# base64 for the PKCE verifier, rand to generate it.
base64 = "0.22"
rand = "0.8"

# Open the student's own browser for "Sign in with browser" and for external links.
open = "5"

[profile.release]
# A single-file installer is friendlier to download over a school connection, and nothing here
# is CPU-bound, so trade build time for size.
panic = "abort"
strip = true
lto = true
opt-level = "s"
